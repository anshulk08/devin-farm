<!doctype html><meta charset=utf-8>
<style>
@font-face{font-family:Inter;font-weight:400;src:url(Inter-Regular.ttf)}
@font-face{font-family:Inter;font-weight:500;src:url(Inter-Medium.ttf)}
@font-face{font-family:Inter;font-weight:600;src:url(Inter-SemiBold.ttf)}
@font-face{font-family:"JetBrains Mono";font-weight:500;src:url(JetBrainsMono-Medium.ttf)}
:root{--ground:#0e0f11;--dot:#1b1d21;--text:#e8e9eb;--dim:#8d9199}
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:640px;overflow:hidden;background:var(--ground)}
.c{position:relative;width:1280px;height:640px;background:
 radial-gradient(ellipse at center,transparent 55%,var(--ground) 100%),
 radial-gradient(circle,var(--dot) 1px,transparent 1.2px) 0 0/22px 22px,var(--ground);font-family:Inter}
.shot{position:absolute;right:0;top:0;width:780px;height:640px;overflow:hidden;
 -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 30%);}
.shot img{position:absolute;width:1387px;left:-300px;top:-60px}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--ground) 0,rgba(14,15,17,.9) 36%,rgba(14,15,17,0) 62%)}
.t{position:absolute;left:72px;top:0;height:640px;width:600px;display:flex;flex-direction:column;justify-content:center}
h1{font-weight:600;font-size:92px;letter-spacing:-3.2px;line-height:1;color:var(--text)}
p{margin-top:28px;font-size:29px;line-height:1.38;font-weight:400;color:var(--dim);letter-spacing:-.3px;max-width:520px}
p b{font-weight:500;color:var(--text)}
.m{position:absolute;left:72px;bottom:56px;font:500 14px "JetBrains Mono";letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.m i{font-style:normal;color:#5f636b;margin:0 10px}
</style>
<div class=c>
 <div class=shot><img src="graph.png"></div><div class=shade></div>
 <div class=t><h1>Devin Farm</h1><p>Run parallel cloud agents on real hardware, <b>securely and correctly.</b></p></div>
 <div class=m>Security<i>·</i>Parallelism<i>·</i>Convenience<i>·</i>Correctness</div>
</div>
