name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/check.sh
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [rig, verifier, control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: test ${{ matrix.dir }}
        run: |
          if [ ! -d "${{ matrix.dir }}" ]; then echo "no ${{ matrix.dir }}/ yet"; exit 0; fi
          cd "${{ matrix.dir }}"
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; elif [ -f requirements.txt ]; then pip install -r requirements.txt pytest; else pip install pytest; fi
          pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: build web
        run: |
          if [ ! -f web/package.json ]; then echo "no web/ yet"; exit 0; fi
          cd web && npm ci && npm run typecheck --if-present && npm run build
  e2e-mock:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: ci/e2e_mock.sh
